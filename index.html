<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3d5a2a"><link rel="icon" href="icon-192.png"><title>إدارة المستودع</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f2;--sf:#fff;--tx:#1d2a1f;--mu:#667;--ac:#3d5a2a;--bd:#d9ddd5;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141813;--sf:#1f251e;--tx:#e8ece6;--mu:#9aa49a;--ac:#8fb36b;--bd:#343b32;--rd:#f2776f}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ac);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
main{padding:12px 12px 80px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto}
nav button{flex:1;min-width:64px;border:0;background:none;color:var(--mu);padding:8px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:700}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.g{flex:1}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit}
button.s{background:none;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
button.d{color:var(--rd);border-color:var(--rd)}
.m{color:var(--mu);font-size:13px}.lo{color:var(--rd);font-weight:700}
img.t{width:52px;height:52px;object-fit:cover;border-radius:8px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov>div{background:var(--sf);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}
#lk{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#lk>div{width:100%;max-width:340px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:right}
</style></head><body>
<div id="lk"></div><div id="app"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),LK=$('#lk'),OV=$('#ov');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,view='items',q='',tmp=null,idleT,auth=null,set={idle:2},ok=false;
const P=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const S=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const all=n=>P(S(n).getAll()),put=(n,v)=>P(S(n,'readwrite').put(v)),del=(n,k)=>P(S(n,'readwrite').delete(k)),get=(n,k)=>P(S(n).get(k));
const ST=['items','moves','custody','meta'];
function open(){return new Promise((a,b)=>{const r=indexedDB.open('warehouse_db',1);r.onupgradeneeded=()=>{const d=r.result;['items','moves','custody'].forEach(n=>d.createObjectStore(n,{keyPath:'id',autoIncrement:true}));d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>{db=r.result;a()};r.onerror=()=>b(r.error)})}
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function H(s,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),'PBKDF2',false,['deriveBits']);return b2h(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
const rnd=n=>{const a=crypto.getRandomValues(new Uint8Array(n));return b2h(a)};
const REC=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=crypto.getRandomValues(new Uint8Array(16));return [...a].map(x=>c[x%c.length]).join('').replace(/(.{4})/g,'$1-').slice(0,-1)};
const fmt=d=>new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const TN={add:'إضافة صنف',in:'وارد',out:'صادر',damage:'تالف',short:'ناقص',issue:'صرف عُهدة',ret:'إرجاع عُهدة',count:'جرد'};
const toast=m=>{alert(m)};
/* ---------- القفل ---------- */
async function boot(){await open();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
 auth=await get('meta','auth');const s=await get('meta','set');if(s)set=s;showLock()}
function showLock(){ok=false;A.innerHTML='';OV.style.display='none';OV.innerHTML='';clearTimeout(idleT);LK.style.display='flex';
 if(!auth){LK.innerHTML=`<div><h2>🛡️ إنشاء رمز PIN</h2><p class="m">أنشئ رمزاً من 4 إلى 8 أرقام. لا يُخزَّن الرمز نفسه، بل بصمة مشتقة منه فقط.</p>
 <input id="p1" type="password" inputmode="numeric" maxlength="8" placeholder="الرمز"><input id="p2" type="password" inputmode="numeric" maxlength="8" placeholder="تأكيد الرمز"><button class="b" style="width:100%" onclick="setup()">إنشاء</button></div>`;return}
 const wait=(auth.until||0)-Date.now();
 LK.innerHTML=`<div><h2>🔒 المستودع مقفل</h2><input id="p1" type="password" inputmode="numeric" maxlength="8" placeholder="رمز PIN" ${wait>0?'disabled':''}>
 <p class="m" id="er">${wait>0?'محاولات كثيرة. انتظر '+Math.ceil(wait/1000)+' ثانية':''}</p><button class="b" style="width:100%" onclick="login()">فتح</button>
 <p><button class="s" onclick="forgot()">نسيت الرمز</button></p></div>`;
 const i=$('#p1');i&&i.addEventListener('keydown',x=>x.key==='Enter'&&login())}
async function setup(){const a=$('#p1').value,b=$('#p2').value;if(!/^\d{4,8}$/.test(a))return toast('الرمز يجب أن يكون 4 إلى 8 أرقام');if(a!==b)return toast('الرمزان غير متطابقين');
 const salt=rnd(16),rs=rnd(16),rc=REC();auth={k:'auth',salt,pin:await H(a,salt),rs,rec:await H(rc.replace(/-/g,''),rs),fails:0,until:0};await put('meta',auth);
 LK.innerHTML=`<div><h2>رمز الاستعادة</h2><p>احفظ هذا الرمز خارج الهاتف. يظهر مرة واحدة فقط، وهو الطريقة الوحيدة لتعيين رمز جديد دون فقدان البيانات.</p><h3 dir="ltr" style="letter-spacing:1px">${rc}</h3><button class="b" style="width:100%" onclick="enter()">حفظته، متابعة</button></div>`}
async function login(){const p=$('#p1').value;if((auth.until||0)>Date.now())return showLock();
 if(await H(p,auth.salt)===auth.pin){auth.fails=0;auth.until=0;await put('meta',auth);enter()}
 else{auth.fails=(auth.fails||0)+1;if(auth.fails%5===0)auth.until=Date.now()+30000*auth.fails/5;await put('meta',auth);showLock();$('#er').textContent='الرمز غير صحيح'}}
function forgot(){LK.innerHTML=`<div><h2>استعادة الوصول</h2><p class="m">أدخل رمز الاستعادة المحفوظ لتعيين رمز جديد مع بقاء البيانات.</p>
 <input id="rc" dir="ltr" placeholder="XXXX-XXXX-XXXX-XXXX"><input id="p1" type="password" inputmode="numeric" maxlength="8" placeholder="الرمز الجديد"><button class="b" style="width:100%" onclick="recover()">تعيين رمز جديد</button>
 <p class="m">فقدت رمز الاستعادة؟ الخيار الوحيد مسح كل البيانات المحلية (يمكنك بعدها الاستعادة من نسخة احتياطية).</p><button class="s d" onclick="wipe()">مسح كل البيانات</button><p><button class="s" onclick="showLock()">رجوع</button></p></div>`}
async function recover(){const rc=$('#rc').value.toUpperCase().replace(/[^A-Z0-9]/g,''),p=$('#p1').value;if(!/^\d{4,8}$/.test(p))return toast('رمز جديد غير صالح');
 if(await H(rc,auth.rs)!==auth.rec)return toast('رمز الاستعادة غير صحيح');auth.salt=rnd(16);auth.pin=await H(p,auth.salt);auth.fails=0;auth.until=0;await put('meta',auth);enter()}
async function wipe(){if(!confirm('سيتم حذف جميع بيانات المستودع نهائياً. متأكد؟'))return;db.close();await new Promise(r=>{const x=indexedDB.deleteDatabase('warehouse_db');x.onsuccess=x.onerror=x.onblocked=r});auth=null;set={idle:2};await open();showLock()}
function enter(){ok=true;LK.style.display='none';LK.innerHTML='';shell();bump()}
function lock(){if(ok||LK.style.display!=='flex')showLock()}
function bump(){clearTimeout(idleT);if(ok&&set.idle>0)idleT=setTimeout(lock,set.idle*60000)}
['pointerdown','keydown','scroll','touchstart'].forEach(v=>addEventListener(v,()=>ok&&bump(),{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ok)lock()});addEventListener('pagehide',()=>ok&&lock());
/* ---------- الواجهة ---------- */
const TABS=[['items','📦','الأصناف'],['custody','🧰','العُهد'],['count','📋','الجرد'],['log','🕑','السجل'],['rep','📊','التقارير'],['set','⚙️','الإعدادات']];
function shell(){A.innerHTML=`<header><b>🛡️ إدارة المستودع</b><button class="s" style="color:#fff;border-color:#fff" onclick="lock()">🔒 قفل</button></header><main id="v"></main><nav>${TABS.map(t=>`<button data-v="${t[0]}" onclick="go('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join('')}</nav>`;go(view)}
async function go(v){if(!ok)return;view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#v').innerHTML=await V[v]()}
const rf=()=>go(view);
function modal(h){OV.innerHTML='<div>'+h+'</div>';OV.style.display='flex'}
function close_(){OV.style.display='none';OV.innerHTML='';tmp=null}
OV.addEventListener('click',x=>{if(x.target===OV)close_()});
function pick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmp=c.toDataURL('image/jpeg',.75);$('#pv').src=tmp;$('#pv').style.display='block'};im.src=r.result};r.readAsDataURL(f)}
const IMG='<input type="file" accept="image/*" onchange="pick(this)"><img id="pv" class="t" style="display:none;width:90px;height:90px">';
const V={
async items(){const it=await all('items'),cs=[...new Set(it.map(i=>i.cat).filter(Boolean))];const l=it.filter(i=>(i.name+' '+(i.cat||'')+' '+(i.note||'')).includes(q));
 return `<div class="r"><input class="g" placeholder="🔍 بحث في الأصناف والتصنيفات" value="${e(q)}" oninput="q=this.value;lst()"><button class="b" onclick="itemForm()">+ صنف</button></div><div id="ls">${card(l)}</div>`},
async custody(){const c=(await all('custody')).filter(x=>x.left>0),it=Object.fromEntries((await all('items')).map(i=>[i.id,i]));
 return `<h3>العُهد المفتوحة</h3>`+(c.map(x=>`<div class="c"><b>${e(it[x.itemId]?.name)}</b> — ${x.left} ${e(it[x.itemId]?.unit)}<div class="m">عند: ${e(x.person)} · ${fmt(x.date)}</div><button class="s" onclick="retForm(${x.id})">إرجاع</button></div>`).join('')||'<p class="m">لا توجد عُهد مفتوحة. للصرف استخدم زر «عُهدة» في بطاقة الصنف.</p>')},
async count(){const it=await all('items');return `<h3>الجرد</h3><p class="m">أدخل الكمية الفعلية؛ تُسجَّل الفروق فقط.</p>`+it.map(i=>`<div class="c r"><span class="g">${e(i.name)}<br><span class="m">بالنظام: ${i.qty}</span></span><input type="number" min="0" style="width:90px" data-i="${i.id}" placeholder="${i.qty}"></div>`).join('')+`<button class="b" style="width:100%" onclick="doCount()">اعتماد الجرد</button>`},
async log(){const m=(await all('moves')).reverse(),it=Object.fromEntries((await all('items')).map(i=>[i.id,i]));
 return `<h3>سجل الحركات</h3><input placeholder="🔍 بحث" value="${e(q)}" oninput="q=this.value;rf()">`+m.filter(x=>((it[x.itemId]?.name||x.name||'')+TN[x.type]+(x.note||'')).includes(q)).slice(0,200).map(x=>`<div class="c r">${x.img?`<img class="t" src="${x.img}">`:''}<div class="g"><b>${TN[x.type]}</b> · ${e(it[x.itemId]?.name||x.name)} · ${x.qty}<div class="m">${fmt(x.date)} ${x.person?'· '+e(x.person):''}</div><div class="m">${e(x.note)}</div></div></div>`).join('')},
async rep(){const it=await all('items'),m=await all('moves'),sum=(id,t)=>m.filter(x=>x.itemId===id&&x.type===t).reduce((a,x)=>a+x.qty,0);
 const low=it.filter(i=>i.qty<=i.min);return `<h3>التقارير</h3><div class="c">عدد الأصناف: <b>${it.length}</b> · الحركات: <b>${m.length}</b></div><div class="c"><b>تحت الحد الأدنى (${low.length})</b>${low.map(i=>`<div class="lo">${e(i.name)}: ${i.qty}/${i.min}</div>`).join('')||'<div class="m">لا يوجد</div>'}</div>
 <div style="overflow-x:auto"><table><tr><th>الصنف</th><th>الرصيد</th><th>وارد</th><th>صادر</th><th>تالف</th><th>ناقص</th></tr>${it.map(i=>`<tr><td>${e(i.name)}</td><td>${i.qty}</td><td>${sum(i.id,'in')}</td><td>${sum(i.id,'out')}</td><td>${sum(i.id,'damage')}</td><td>${sum(i.id,'short')}</td></tr>`).join('')}</table></div>`},
async set(){return `<h3>الإعدادات</h3><div class="c"><b>القفل التلقائي عند الخمول</b><select onchange="setIdle(this.value)">${[1,2,5,10,15].map(n=>`<option value="${n}" ${set.idle==n?'selected':''}>${n} دقيقة</option>`).join('')}</select><div class="m">يُقفل التطبيق أيضاً فور انتقاله إلى الخلفية.</div></div>
 <div class="c"><b>تغيير الرمز</b><input id="op" type="password" inputmode="numeric" placeholder="الرمز الحالي"><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="الرمز الجديد"><button class="b" onclick="chPin()">تغيير</button></div>
 <div class="c"><b>نسخة احتياطية</b><div class="m">تتضمن الأصناف والحركات والعُهد والصور، ولا تتضمن الرمز. النسخة غير مشفّرة، فاحفظها في مكان آمن.</div><button class="b" onclick="backup()">إنشاء نسخة</button><textarea id="bk" rows="4" placeholder="نص النسخة / الصق نسخة هنا للاستعادة"></textarea>
 <div class="r"><button class="s" onclick="navigator.clipboard.writeText($('#bk').value).then(()=>toast('تم النسخ'))">نسخ</button><button class="s" onclick="restore($('#bk').value)">استعادة من النص</button></div><input type="file" accept=".json,application/json" onchange="rfile(this)"></div>
 <div class="c"><b>التخزين والحذف</b><p class="m">البيانات محفوظة في قاعدة IndexedDB داخل هذا المتصفح/التطبيق على هذا الجهاز فقط، ولا تُرسل لأي خادم. حذف التطبيق أو مسح بيانات الموقع أو إعادة التثبيت <b>يحذف قاعدة البيانات نهائياً</b> ولا تُستعاد تلقائياً؛ الاستعادة تتم فقط من نسخة احتياطية حفظتها خارج التطبيق.</p></div>`}};
const card=l=>l.map(i=>`<div class="c"><div class="r">${i.img?`<img class="t" src="${i.img}">`:''}<div class="g"><b>${e(i.name)}</b> <span class="m">${e(i.cat)}</span><div>${i.qty} ${e(i.unit)} ${i.qty<=i.min?'<span class="lo">⚠ منخفض</span>':''}</div><div class="m">${e(i.note)}</div></div></div>
<div class="r" style="margin-top:6px"><button class="s" onclick="mv(${i.id},'in')">وارد</button><button class="s" onclick="mv(${i.id},'out')">صادر</button><button class="s" onclick="mv(${i.id},'damage')">تالف</button><button class="s" onclick="mv(${i.id},'short')">ناقص</button><button class="s" onclick="mv(${i.id},'issue')">عُهدة</button><button class="s" onclick="itemForm(${i.id})">تعديل</button></div></div>`).join('')||'<p class="m">لا توجد أصناف.</p>';
async function lst(){const it=await all('items');$('#ls').innerHTML=card(it.filter(i=>(i.name+' '+(i.cat||'')+' '+(i.note||'')).includes(q)))}
/* ---------- العمليات ---------- */
async function itemForm(id){const i=id?await get('items',id):{},cs=[...new Set((await all('items')).map(x=>x.cat).filter(Boolean))];tmp=i.img||null;
 modal(`<h3>${id?'تعديل':'إضافة'} صنف</h3><input id="n" placeholder="الاسم" value="${e(i.name)}"><input id="c" list="cl" placeholder="التصنيف" value="${e(i.cat)}"><datalist id="cl">${cs.map(c=>`<option value="${e(c)}">`).join('')}</datalist><input id="u" placeholder="الوحدة (قطعة، صندوق…)" value="${e(i.unit)}">
 ${id?'':'<input id="q" type="number" min="0" placeholder="الكمية الافتتاحية">'}<input id="mn" type="number" min="0" placeholder="الحد الأدنى" value="${i.min??''}"><textarea id="nt" placeholder="ملاحظات">${e(i.note)}</textarea>${IMG}
 <div class="r"><button class="b" onclick="saveItem(${id||0})">حفظ</button><button class="s" onclick="close_()">إلغاء</button>${id?`<button class="s d" onclick="delItem(${id})">حذف</button>`:''}</div>`);if(tmp){$('#pv').src=tmp;$('#pv').style.display='block'}}
async function saveItem(id){const n=$('#n').value.trim();if(!n)return toast('الاسم مطلوب');const o=id?await get('items',id):{qty:0,date:Date.now()};
 Object.assign(o,{name:n,cat:$('#c').value.trim(),unit:$('#u').value.trim(),min:+$('#mn').value||0,note:$('#nt').value,img:tmp});
 if(!id){o.qty=Math.max(0,+$('#q').value||0);const r=await put('items',o);await put('moves',{itemId:r,type:'add',qty:o.qty,note:o.note,img:tmp,date:Date.now()})}else await put('items',o);close_();rf()}
async function delItem(id){if(!confirm('حذف الصنف وجميع حركاته؟'))return;const m=await all('moves');for(const x of m)if(x.itemId===id)await del('moves',x.id);await del('items',id);close_();rf()}
function mv(id,t){tmp=null;modal(`<h3>${TN[t]==='صرف عُهدة'?'صرف عُهدة':TN[t]}</h3><input id="mq" type="number" min="1" placeholder="الكمية">${t==='issue'?'<input id="mp" placeholder="اسم المستلم">':''}<textarea id="mn2" placeholder="ملاحظات"></textarea>${IMG}<div class="r"><button class="b" onclick="doMove(${id},'${t}')">تسجيل</button><button class="s" onclick="close_()">إلغاء</button></div>`)}
async function doMove(id,t){const n=+$('#mq').value;if(!(n>0))return toast('أدخل كمية صحيحة');const p=$('#mp')?.value.trim();if(t==='issue'&&!p)return toast('اسم المستلم مطلوب');
 const tx=db.transaction(['items','moves','custody'],'readwrite'),it=await P(tx.objectStore('items').get(id));
 if(t!=='in'&&n>it.qty){tx.abort();return toast('الكمية أكبر من الرصيد ('+it.qty+')')}
 it.qty+=t==='in'?n:-n;tx.objectStore('items').put(it);tx.objectStore('moves').put({itemId:id,type:t,qty:n,note:$('#mn2').value,img:tmp,person:p||'',date:Date.now()});
 if(t==='issue')tx.objectStore('custody').put({itemId:id,person:p,qty:n,left:n,date:Date.now()});
 await new Promise(r=>tx.oncomplete=r);close_();rf()}
async function retForm(id){const c=await get('custody',id);modal(`<h3>إرجاع عُهدة</h3><p class="m">المتبقي: ${c.left}</p><input id="rq" type="number" min="1" max="${c.left}" value="${c.left}"><textarea id="rn" placeholder="ملاحظات / حالة المادة"></textarea><div class="r"><button class="b" onclick="doRet(${id})">إرجاع</button><button class="s" onclick="close_()">إلغاء</button></div>`)}
async function doRet(id){const tx=db.transaction(['items','moves','custody'],'readwrite'),c=await P(tx.objectStore('custody').get(id)),n=+$('#rq').value;if(!(n>0&&n<=c.left)){tx.abort();return toast('كمية غير صحيحة')}
 const it=await P(tx.objectStore('items').get(c.itemId));it.qty+=n;c.left-=n;tx.objectStore('items').put(it);tx.objectStore('custody').put(c);tx.objectStore('moves').put({itemId:c.itemId,type:'ret',qty:n,note:$('#rn').value,person:c.person,date:Date.now()});await new Promise(r=>tx.oncomplete=r);close_();rf()}
async function doCount(){const ins=[...document.querySelectorAll('[data-i]')].filter(x=>x.value!=='');if(!ins.length)return toast('لم تُدخل أي كمية');let d=0;
 const tx=db.transaction(['items','moves'],'readwrite');for(const x of ins){const it=await P(tx.objectStore('items').get(+x.dataset.i)),v=Math.max(0,+x.value);if(v!==it.qty){tx.objectStore('moves').put({itemId:it.id,type:'count',qty:v,note:`كان ${it.qty} ← أصبح ${v}`,date:Date.now()});it.qty=v;tx.objectStore('items').put(it);d++}}
 await new Promise(r=>tx.oncomplete=r);toast('تم الجرد. عدد الفروق: '+d);rf()}
/* ---------- الإعدادات والنسخ ---------- */
async function setIdle(v){set={k:'set',idle:+v};await put('meta',set);bump()}
async function chPin(){const o=$('#op').value,n=$('#np').value;if(await H(o,auth.salt)!==auth.pin)return toast('الرمز الحالي خطأ');if(!/^\d{4,8}$/.test(n))return toast('4 إلى 8 أرقام');auth.salt=rnd(16);auth.pin=await H(n,auth.salt);await put('meta',auth);$('#op').value=$('#np').value='';toast('تم تغيير الرمز')}
async function backup(){const o={app:'warehouse',v:1,date:Date.now(),items:await all('items'),moves:await all('moves'),custody:await all('custody')};$('#bk').value=JSON.stringify(o)}
function rfile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f)}
async function restore(t){let o;try{o=JSON.parse(t)}catch(_){return toast('نسخة غير صالحة')}if(o.app!=='warehouse')return toast('ليست نسخة مستودع');if(!confirm('ستُستبدل البيانات الحالية بالنسخة. متابعة؟'))return;
 const tx=db.transaction(['items','moves','custody'],'readwrite');for(const n of['items','moves','custody']){tx.objectStore(n).clear();(o[n]||[]).forEach(x=>tx.objectStore(n).put(x))}await new Promise(r=>tx.oncomplete=r);toast('تمت الاستعادة');go('items')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
